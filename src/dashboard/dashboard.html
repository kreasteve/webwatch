<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Datenspur — Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../icons/icon-32.png" alt="" width="20" height="20"> Datenspur</div>
    <div class="pageinfo" id="pageinfo"></div>
    <nav class="views">
      <button data-view="uebersicht" class="active">Übersicht</button>
      <button data-view="anfragen">Anfragen</button>
      <button data-view="netzwerk">Netzwerk</button>
      <button data-view="lexikon">Lexikon</button>
    </nav>
    <div class="mode" title="Einfach: Klartext-Erklärungen. Profi: zusätzlich Rohdaten (Header, Bodys, alle Spalten).">
      <button id="mode-laie" class="active">Einfach</button>
      <button id="mode-profi">Profi</button>
    </div>
    <label class="cb" title="Wenn aktiv, beginnt die Aufzeichnung beim Neuladen der Seite (F5) von vorn. Beim Wechsel zu einer anderen Seite im selben Tab wird immer weitergesammelt — bis der Tab geschlossen oder manuell geleert wird.">
      <input type="checkbox" id="set-reload" checked> Neuladen leert
    </label>
    <button id="btn-reset-dash" class="std small" title="Aufzeichnung für diesen Tab jetzt leeren">Leeren</button>
  </header>

  <main>
    <section id="view-uebersicht" class="view"></section>
    <section id="view-anfragen" class="view" hidden></section>
    <section id="view-netzwerk" class="view" hidden></section>
    <section id="view-lexikon" class="view" hidden></section>
  </main>

  <footer class="dbbar">
    <span class="lbl">Tracker-Datenbank</span>
    <span id="db-stand">—</span>
    <button id="btn-db-update" class="std small"
      title="Holt die aktuelle Liste von GitHub. Passiert ausschließlich auf diesen Klick — Datenspur verbindet sich sonst mit keinem Server.">Aktualisieren</button>
    <span id="db-status" class="status"></span>
  </footer>

  <div id="picker" class="picker" hidden></div>

  <script src="../common/compat.js"></script>
  <script src="../common/domain.js"></script>
  <script src="../common/categories.js"></script>
  <script src="../common/trackerdb.js"></script>
  <script src="../common/dbupdate.js"></script>
  <script src="../common/decoder.js"></script>
  <script src="../common/score.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
